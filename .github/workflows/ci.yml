name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run typecheck
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Run mocked production E2E suite
        run: bun run test:e2e

  macos-deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and launchd syntax
        run: |
          for script in deploy/install.sh deploy/run.sh deploy/uninstall.sh deploy/macos-deploy.test.sh; do
            bash -n "$script"
          done
          plutil -lint deploy/com.mail.local.plist
      - name: Test isolated launcher and uninstall contracts
        run: bash deploy/macos-deploy.test.sh

  windows-install:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: mail workspace
    steps:
      - uses: actions/checkout@v4
        with:
          path: mail workspace
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mail workspace/package.json
      - name: Test Windows PowerShell 5.1 and real scheduled startup
        run: |
          "MAIL_LOG_DIR=$env:LOCALAPPDATA\MailLocal" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\deploy\windows-install.test.ps1 -Integration
      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-logs
          path: ${{ env.MAIL_LOG_DIR }}
          if-no-files-found: ignore
