name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run typecheck
      - run: bun run build
      - name: Check publish package allowlist
        run: bun run check:package
      - run: bunx playwright install --with-deps chromium
      - name: Run mocked production E2E suite
        run: bun run test:e2e

  npm-resolver-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Ensure npm 10.9.2
        run: |
          if [ "$(npm --version)" != "10.9.2" ]; then
            npm install --global npm@10.9.2
          fi
          test "$(npm --version)" = "10.9.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install from frozen Bun lockfile
        run: bun install --frozen-lockfile
      - name: Probe npm resolver without changing the lockfile
        run: |
          cp bun.lock "$RUNNER_TEMP/bun.lock.before"
          npm update --dry-run --ignore-scripts --no-audit --no-fund
          cmp --silent "$RUNNER_TEMP/bun.lock.before" bun.lock
          git diff --exit-code -- bun.lock

  macos-deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and launchd syntax
        run: |
          for script in deploy/install.sh deploy/run.sh deploy/uninstall.sh deploy/macos-deploy.test.sh; do
            bash -n "$script"
          done
          plutil -lint deploy/com.mail.local.plist
      - name: Test isolated launcher and uninstall contracts
        run: bash deploy/macos-deploy.test.sh

  windows-install:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: mail workspace
    steps:
      - uses: actions/checkout@v4
        with:
          path: mail workspace
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: mail workspace/package.json
      - name: Test Windows PowerShell 5.1 and real scheduled startup
        run: |
          "MAIL_LOG_DIR=$env:LOCALAPPDATA\MailLocal" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\deploy\windows-install.test.ps1 -Integration
      - name: Save installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-logs
          path: ${{ env.MAIL_LOG_DIR }}
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack and validate the actual archive
        run: |
          npm pack --json --ignore-scripts > pack-receipt.json
          node scripts/check-package.mjs --receipt pack-receipt.json
          node <<'NODE'
          const { copyFileSync, mkdirSync, readFileSync, statSync } = require("node:fs");
          const { resolve } = require("node:path");
          const receipt = JSON.parse(readFileSync("pack-receipt.json", "utf8"));
          const item = Array.isArray(receipt) ? receipt[0] : receipt;
          if (!item || typeof item.filename !== "string") throw new Error("npm pack receipt has no filename");
          const source = resolve(item.filename);
          if (!statSync(source).isFile()) throw new Error(`Packed tarball is not a file: ${source}`);
          mkdirSync("artifact", { recursive: true });
          copyFileSync(source, "artifact/sj-mail.tgz");
          NODE
          node scripts/check-package.mjs artifact/sj-mail.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-sj-mail-package
          path: artifact/sj-mail.tgz
          if-no-files-found: error

  package-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: ci-sj-mail-package
          path: artifact
      - name: Run packaged smoke test
        run: node scripts/package-smoke.mjs artifact/sj-mail.tgz
